<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearts of Iran | چت روم</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

    <header class="hero" style="padding:15px 20px 25px;">
        <h1 style="font-size:1.8rem;">Hearts of Iran</h1>
        <div class="subtitle" style="font-size:1rem;">چت روم</div>
    </header>

    <nav>
        <div class="nav-container">
            <div class="nav-left">
                <button class="user-btn-nav show" id="userBtnNav">👤 پنل کاربری</button>
                <button class="chat-btn-nav show" id="chatBtnNav">💬 چت روم</button>
            </div>
            <div class="nav-center">
                <a href="index.html">🏠 خانه</a>
                <a href="index.html#eventsSection">⏳ رویدادها</a>
                <a href="#">🗺️ نقشه</a>
                <a href="#">⚙️ آپدیت‌ها</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-nav" id="themeToggleNav">
                    <span id="themeIconNav">🌙</span>
                    <span id="themeLabelNav">تاریک</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">

        <!-- ============================================================
        بخش چت روم - فقط این بخش توی این صفحه هست
        ============================================================ -->
        <div id="chatSection" class="chat-room active">
            <div class="chat-container">

                <!-- لیست کاربران -->
                <div class="chat-users" id="chatUsersList">
                    <div class="users-title">👥 کاربران آنلاین</div>
                    <div id="usersListContainer">
                        <div style="text-align:center; color:var(--text-secondary); padding:20px; opacity:0.5;">
                            در حال بارگذاری...
                        </div>
                    </div>
                </div>

                <!-- بخش پیام‌ها -->
                <div class="chat-main">
                    <div class="chat-header">
                        <span class="chat-title">💬 چت روم</span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div style="text-align:center; color:var(--text-secondary); padding:40px 0;">
                            در حال بارگذاری...
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
                        <button class="send-btn" id="sendChatBtn">📤</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ============================================================
        پنل مدیریت - فقط برای مدیر
        ============================================================ -->
        <div id="adminPanel" class="admin-panel">
            <div class="admin-header">
                <h2>🛡️ پنل مدیریت</h2>
                <p>مدیریت کاربران سایت</p>
                <button class="close-admin" onclick="closeAdminPanel()">❌ بستن پنل</button>
            </div>

            <div class="admin-content">
                <h3>👥 لیست کاربران</h3>
                <div id="adminUsersList">
                    <!-- توسط جاوااسکریپت پر میشه -->
                </div>
            </div>
        </div>

    </main>

    <footer>
        <p style="color:var(--text-secondary); font-size:0.85rem;">Hearts of Iran © ۲۰۲۶</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
